# Builds myCraft for Windows, macOS and Linux and drafts a GitHub release
# whenever the version in app/Cargo.toml is bumped on main.
#
# Flow: version -> build (one job per OS/arch) -> release (draft with notes and
# SHA256SUMS.txt). Review the draft on GitHub, then press "Publish release".
# Pushes that don't change the version are skipped once v<version> is
# published; while it is still a draft, a re-run replaces its files.
name: Release

on:
  push:
    branches: [main]
    paths: [app/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$v" =~ $semver ]]; then
            echo "::error::'$v' in app/Cargo.toml is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          build=true
          if draft=$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null) && [ "$draft" != "true" ]; then
            echo "Release v$v is already published, skipping. Bump the version in app/Cargo.toml to release again."
            build=false
          fi
          {
            echo "version=$v"
            echo "prerelease=$pre"
            echo "build=$build"
          } >>"$GITHUB_OUTPUT"
          echo "### myCraft v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-latest, os: windows, arch: x64 }
          - { name: Windows arm64, runner: windows-11-arm, os: windows, arch: arm64 }
          - { name: macOS universal, runner: macos-latest, os: macos, arch: universal }
          - { name: Linux x86_64, runner: ubuntu-22.04, os: linux, arch: x86_64 }
          - { name: Linux aarch64, runner: ubuntu-22.04-arm, os: linux, arch: aarch64 }
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # ring (TLS for ureq) needs clang to build for Windows on ARM.
      - name: Make sure clang is available
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        run: |
          if ! command -v clang >/dev/null; then
            choco install llvm -y --no-progress
          fi
          echo "C:\\Program Files\\LLVM\\bin" >>"$GITHUB_PATH"

      - name: Test
        working-directory: app
        run: cargo test --locked

      - name: Build and package
        run: |
          mkdir -p dist
          base="mycraft-$VERSION-${{ matrix.os }}-${{ matrix.arch }}"
          case "${{ matrix.os }}" in
            windows)
              (cd app && cargo build --release --locked)
              cp app/target/release/mycraft.exe "dist/$base.exe"
              ;;
            linux)
              (cd app && cargo build --release --locked)
              mkdir -p "pkg/$base"
              cp app/target/release/mycraft LICENSE README.md "pkg/$base/"
              tar -C pkg -czf "dist/$base.tar.gz" "$base"
              ;;
            macos)
              (cd app && cargo build --release --locked --target aarch64-apple-darwin \
                      && cargo build --release --locked --target x86_64-apple-darwin)
              app="pkg/myCraft.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              lipo -create -output "$app/Contents/MacOS/mycraft" \
                app/target/aarch64-apple-darwin/release/mycraft \
                app/target/x86_64-apple-darwin/release/mycraft
              # App icon from the logo, padded to a square first.
              sips --padToHeightWidth 256 256 app/assets/logo.png --out pkg/icon.png >/dev/null
              mkdir -p pkg/mycraft.iconset
              for s in 16 32 128 256; do
                sips -z $s $s pkg/icon.png --out "pkg/mycraft.iconset/icon_${s}x${s}.png" >/dev/null
              done
              for s in 16 128; do
                sips -z $((s * 2)) $((s * 2)) pkg/icon.png --out "pkg/mycraft.iconset/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns pkg/mycraft.iconset -o "$app/Contents/Resources/mycraft.icns"
              cat >"$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>myCraft</string>
            <key>CFBundleDisplayName</key><string>myCraft</string>
            <key>CFBundleIdentifier</key><string>com.dekate.mycraft</string>
            <key>CFBundleExecutable</key><string>mycraft</string>
            <key>CFBundleIconFile</key><string>mycraft</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
              # Ad-hoc signature: required to run on Apple silicon. Not notarized.
              codesign --force --deep --sign - "$app"
              ditto -c -k --keepParent "$app" "dist/$base.zip"
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [version, build]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes need every tag and commit

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt

      - name: Write release notes
        run: bash .github/scripts/release-notes.sh >notes.md && cat notes.md

      - name: Create or update draft release
        run: |
          tag="v$VERSION"
          title="myCraft $tag"
          pre=()
          if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating draft $tag: replacing its notes and files"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes-file notes.md --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- artifacts/*
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes-file notes.md "${pre[@]}" -- artifacts/*
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' artifacts/SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
